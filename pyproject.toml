[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "taski-control"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "httpx",
    "pyyaml",
    "uvicorn",
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
