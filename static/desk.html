<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Control layer</title>
  <link rel="stylesheet" href="/assets/console.css">
  <link rel="stylesheet" href="/assets/desk.css">
</head>
<body>
  <main>
    <h1>Control layer</h1>
    <div class="metrics" id="posture"></div>
    <pre class="diagram">client
  POST /v1/chat/completions
  policy, patterns, signatures, Jev, budget
  model
  the same checks on the answer
  one audit line</pre>
    <label for="agent">Agent</label>
    <select id="agent"></select>
    <label for="ask">Request</label>
    <textarea id="ask"></textarea>
    <p><button type="button" class="primary" id="send">Send</button></p>
    <article id="result" class="result" hidden></article>
    <p class="meta"><a href="/v1/audit/export">Download the log</a> · make test</p>
    <section class="rules">
      <div class="presets">
        <button type="button" id="use-standard">Standard</button>
        <button type="button" id="use-strict">Strict</button>
        <button type="button" class="primary" id="save-rules">Save</button>
      </div>
      <p class="meta" id="rules-note"></p>
      <div class="editors">
        <label for="policy-file">policy.yaml</label>
        <textarea id="policy-file" class="config" spellcheck="false"></textarea>
        <label for="signature-file">signatures.json</label>
        <textarea id="signature-file" class="config" spellcheck="false"></textarea>
      </div>
    </section>
  </main>
  <script src="/assets/desk.js"></script>
  <script src="/assets/desk-config.js"></script>
</body>
</html>
