<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Control layer</title>
  <link rel="stylesheet" href="/assets/console.css">
</head>
<body>
  <main>
    <p class="meta">Control layer</p>
    <h1>Try a request</h1>
    <p class="lede">The proxy allows it, stops it, or strips personal data before the model keeps it. Edit the policy file. The next request uses the new rules. A file that fails to parse keeps the last good copy.</p>

    <div class="presets">
      <button type="button" data-preset="safe">Safe question</button>
      <button type="button" data-preset="secret">Secret key</button>
      <button type="button" data-preset="email">Email in the answer</button>
      <button type="button" data-preset="tool">Unlisted tool</button>
      <button type="button" data-preset="coding">Coding example</button>
    </div>

    <label for="agent">Agent</label>
    <select id="agent"></select>
    <label for="prompt">Request</label>
    <textarea id="prompt"></textarea>
    <p><button type="button" class="primary" id="send">Send</button></p>
    <article id="result" class="result" hidden></article>
    <section id="coding" hidden></section>

    <div class="metrics" id="metrics"></div>

    <h2>Policy in force</h2>
    <p class="meta" id="loaded"></p>
    <div class="roster" id="policy"></div>

    <h2>Log</h2>
    <p><a href="/v1/audit/export">Download the log</a></p>
    <table>
      <thead>
        <tr>
          <th>Time</th><th>Agent</th><th>Decision</th><th>Check</th><th>ms</th><th>Jev ms</th><th>USD</th>
        </tr>
      </thead>
      <tbody id="events"></tbody>
    </table>
  </main>
  <script src="/assets/coding.js"></script>
  <script src="/assets/console.js"></script>
</body>
</html>
