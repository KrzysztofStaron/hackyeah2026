profile: default
require_high_confidence: false
agents:
  demo:
    enabled: true
    usd_cap: 1.0
    tools:
    - lookup_customer
    - read_email
    - read_document
    - send_email
    - shell
    - edit_workbook
    - run_sql
    - http_request
models:
  gpt-4o-mini:
    usd_per_1k: 0.00015
trusted_hosts:
- huggingface.co
- github.com
controls:
  pii:
    mode: redact
  secrets:
    mode: strict
  prompt_injection:
    mode: strict
  tool_calls:
    mode: redact
  dangerous_actions:
    mode: strict
