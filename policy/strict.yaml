# Every control stops the agent.
profile: strict
agents:
  demo:
    enabled: true
    usd_cap: 1.0
    tools: [lookup_customer, read_email, read_document, send_email, shell, edit_workbook]
models:
  gpt-4o-mini:
    usd_per_1k: 0.00015
trusted_hosts:
  - huggingface.co
  - github.com
controls:
  pii:
    mode: strict
  secrets:
    mode: strict
  prompt_injection:
    mode: strict
  tool_calls:
    mode: strict
  dangerous_actions:
    mode: strict
