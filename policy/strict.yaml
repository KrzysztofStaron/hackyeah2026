# strict blocks email. Jev thresholds are 0.6.
profile: strict
agents:
  demo:
    enabled: true
    usd_cap: 1.0
    tools: [read_email, lookup_customer]
models:
  gpt-4o-mini:
    usd_per_1k: 0.00015
trusted_hosts:
  - huggingface.co
  - github.com
controls:
  data_email:
    enabled: true
    action: block
  data_secret:
    enabled: true
    action: block
  signatures:
    enabled: true
  jev:
    enabled: true
    action: block
    thresholds:
      instruction_override: 0.6
      data_exfiltration: 0.6
