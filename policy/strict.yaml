# strict blocks email. Jev thresholds are 0.6.
profile: strict
agents:
  demo:
    enabled: true
    usd_cap: 1.0
    tools: [read_email, lookup_customer]
  priya:
    enabled: true
    usd_cap: 1.0
    tools: [read_email, lookup_customer]
  anna:
    enabled: true
    usd_cap: 1.0
    tools: [read_email, lookup_patient, confirm_visit, rebook_slot]
  mira:
    enabled: true
    usd_cap: 1.0
    tools: [search_customers, get_customer, get_invoice, send_email, read_file, download_file, execute_sql, execute_command]
  scout:
    enabled: true
    usd_cap: 1.0
    call_cap: 1
    tools: [search_customers]
models:
  gpt-4o-mini:
    usd_per_1k: 0.00015
trusted_hosts:
  - huggingface.co
  - github.com
controls:
  data_email:
    enabled: true
    action: block
  data_secret:
    enabled: true
    action: block
  signatures:
    enabled: true
  jev:
    enabled: true
    action: block
    thresholds:
      instruction_override: 0.6
      data_exfiltration: 0.6
